name: Radiance PR checks (CPU)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: radiance-cpu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Radiance CPU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the PR merge candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install CPU test dependencies
        # Keep these versions aligned with the conformance lockfile.
        run: python -m pip install PyYAML==6.0.3 pytest==9.1.1 numpy==2.5.3

      - name: Set up uv for registry-selected conformance tests
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          enable-cache: false

      - name: Record the test plan and candidate identity
        run: |
          set -euo pipefail
          {
            echo '### Radiance CPU verification'
            echo "Base: ${PR_BASE_SHA}"
            echo "Merge candidate: $(git rev-parse HEAD)"
            echo 'GPU, R9700 TP2, performance and release qualification: NOT RUN'
          } >> "$GITHUB_STEP_SUMMARY"
          python tools/radiance.py test changed --base "$PR_BASE_SHA" --dry-run

      - name: Verify the original small-vocabulary regression fails
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          original = Path(os.environ['RUNNER_TEMP']) / 'original_radiance_topk.py'
          original.write_bytes(subprocess.check_output([
              'git', 'show', os.environ['PR_BASE_SHA'] + ':radiance_topk.py',
          ]))
          command = [
              'uv', 'run', '--project', 'benchmarks/conformance', '--locked',
              '--group', 'dev', '--extra', 'cpu-tests', 'pytest',
              'tests/test_topk_vocabulary.py::TopKVocabularyTests::test_small_vocab_top_k', '-q',
          ]
          result = subprocess.run(
              command, env=dict(os.environ, RADIANCE_TOPK_TEST_SOURCE=str(original)),
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          print(result.stdout)
          assert result.returncode == 1, 'Expected the original sampling regression to fail'
          assert 'selected index k out of range' in result.stdout, 'Unexpected negative-control failure'
          print('Original source fails with the expected top-k bound error; negative control passed.')
          PY

      - name: Run baseline and changed-area automatic checks
        run: python tools/radiance.py test changed --base "$PR_BASE_SHA"

      - name: Run all repository CPU regressions
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev --extra cpu-tests pytest tests -q

      - name: Run conformance CPU support contracts
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev pytest benchmarks/conformance/tests -q

      - name: Run D7 repair CPU contracts
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev --extra cpu-tests pytest benchmarks/d7-repair/tests -q

      - name: Run source-side NVFP4 CPU conversion contracts
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev --extra cpu-tests python benchmarks/bin/check_nvfp4_conversion.py

      - name: Run source-side FP8 calibration artifact contracts
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev --extra cpu-tests python benchmarks/bin/check_fp8_kv_calibration.py

      - name: Run source-side TunableOp artifact contracts
        if: ${{ !cancelled() }}
        run: uv run --project benchmarks/conformance --locked --group dev --extra cpu-tests python benchmarks/bin/check_tunableop.py
